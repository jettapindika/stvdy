sources_total = 150
max_file_mb = 50
storage_mb = 2000
devices_max = 5
credits_per_month = 500
chat_msgs_per_day = "unlimited"
web_searches_per_day = 30
flashcards_per_month = "unlimited"
quizzes_per_month = "unlimited"
reports_per_month = "unlimited"
