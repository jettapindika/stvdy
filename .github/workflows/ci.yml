name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    env:
      # No database in this job: compile against the committed .sqlx cache.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    services:
      postgres:
        # pgvector, not plain postgres: migration 0001 runs
        # `create extension vector`, which plain postgres cannot satisfy.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stvdy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stvdy
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        # `--locked` no longer works: sqlx 0.9 does not track its Cargo.lock.
        # The TLS feature is `rustls`, not `rustls-ring`.
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls
      - run: sqlx migrate run
      - run: cargo sqlx prepare --workspace --check
      - run: cargo test --workspace

  pdf:
    name: pdf acceptance (Chromium)
    # ubuntu-24.04's runner image ships Google Chrome stable at
    # /usr/bin/google-chrome, which is what CHROME_PATH names. The phase's
    # acceptance test is `#[ignore]`d so a laptop without a browser still gets a
    # green `cargo test --workspace`; this is the job where it must actually run,
    # because a test nobody runs is the same as not having one.
    #
    # No database: the acceptance test renders the template with sample blocks and
    # prints it, so it needs a browser and nothing else. SQLX_OFFLINE keeps it from
    # waiting on a Postgres that is not there.
    runs-on: ubuntu-24.04
    env:
      SQLX_OFFLINE: "true"
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Fail early if Chrome is not where the phase says it is
        # Without this the test panics with "no Chromium found; set CHROME_PATH",
        # which reads like a code problem rather than a runner-image change.
        run: test -x "$CHROME_PATH" || { echo "no Chrome at $CHROME_PATH"; exit 1; }
      - run: cargo test -p stvdy-server --test pdf -- --ignored

  image:
    name: server image (pinned Chromium, pdfium, model)
    # The phase's stated risk is an image that builds and runs on a laptop but not on the
    # host: `find_executable` probes `/Applications/Google Chrome.app/…` first, so on a
    # developer's Mac the PDF pipeline works with the vendor's Chrome, and on a host with
    # no Chrome the symptom is not a failed deploy but a PDF nobody can download
    # (docs/RELEASE.md, A130).
    #
    # The mechanical defence is this job: build the image, boot it against Postgres, and
    # run the same acceptance test the `pdf` job runs on a bare runner — but against the
    # image's own Chromium, pdfium and print assets. A pass here also proves the assets
    # are in the image, because the test asserts no raw `$` delimiter reaches the PDF.
    #
    # The 45-minute timeout is a real bound, not padding: a hang is this job's failure
    # mode (a Chromium that will not start under the sandbox, a boot that never answers
    # /health), and a default timeout would spend an hour discovering it.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stvdy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        run: docker build -t stvdy-server:ci .

      - name: The pin is the pin
        # An image that silently tracked Debian's `stable` would pass every other check in
        # this job: the browser starts, the render works, and the page count changes
        # whenever Debian moves. So the version the image actually has installed is compared
        # to the `ARG` in the Dockerfile, and a mismatch fails the build rather than
        # changing every PDF.
        #
        # **It is the package version that is compared, not `chromium --version`.** The
        # binary reports its upstream version alone (`Chromium 154.0.8037.92 built on Debian
        # GNU/Linux 13 (trixie)`) while the `ARG` is Debian's package version
        # (`154.0.8037.92-1~deb13u1`), so comparing those two strings can never pass — a
        # green-looking check that is really an unsatisfiable one. `dpkg-query` answers the
        # question the pin asks, and the binary's version is checked as the prefix of it.
        run: |
          built=$(docker run --rm --entrypoint /bin/sh stvdy-server:ci -c \
            'dpkg-query -W -f=\${Version} chromium; echo; dpkg-query -W -f=\${Version} chromium-common; echo; dpkg-query -W -f=\${Version} chromium-sandbox')
          declared=$(grep -oE '^ARG CHROMIUM_VERSION=.*' Dockerfile | cut -d= -f2)
          binary=$(docker run --rm --entrypoint /usr/bin/chromium stvdy-server:ci --version)
          echo "package:  $built"
          echo "declared: $declared"
          echo "binary:   $binary"
          # Both packages, because they are built from one source and pinning only the binary
          # would let the pair drift (the Dockerfile's own comment).
          test "$(printf '%s\n' "$built" | sort -u)" = "$declared" || {
            echo "the image's Chromium packages are not the declared pin"; exit 1; }
          case "$binary" in
            "Chromium ${declared%%-*}"*) ;;
            *) echo "the image's Chromium binary does not report the pinned upstream version"
               exit 1;;
          esac

      - name: The other native dependencies are present
        # Each of these has a documented absent-binary policy, and each failure mode is a
        # feature that quietly stops working: no pdfium is a source stuck in `processing`,
        # an empty model cache is a 1.06 GB download at the first ingest (A342).
        run: |
          docker run --rm --entrypoint /bin/sh stvdy-server:ci -c '
            set -e
            test -x "$CHROME_PATH" || { echo "no Chromium at $CHROME_PATH"; exit 1; }
            test -f "$PDFIUM_LIB_PATH" || { echo "no pdfium at $PDFIUM_LIB_PATH"; exit 1; }
            test -x "$SOFFICE_BIN" || { echo "no LibreOffice at $SOFFICE_BIN"; exit 1; }
            test -n "$(ls -A "$FASTEMBED_CACHE_DIR")" || {
              echo "the model cache at $FASTEMBED_CACHE_DIR is empty"; exit 1; }'

      - name: Migrate, then boot
        # `--migrate-only` runs to completion *before* the server starts: two replicas
        # starting together both migrate, and the one that loses the race then serves
        # against a schema it has not verified (A346).
        run: |
          # The migration carries the whole prod environment: `--migrate-only` validates the
          # config before it touches the database, and the image sets `APP_ENV=prod`, which
          # requires `JWT_SECRET`, `ENCRYPTION_KEY_HEX` and `WEB_ORIGIN` (A346).
          docker run --rm --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/stvdy \
            -e APP_ENV=prod \
            -e JWT_SECRET=ci-only-secret-that-is-long-enough \
            -e ENCRYPTION_KEY_HEX=1111111111111111111111111111111111111111111111111111111111111111 \
            -e WEB_ORIGIN=http://localhost:5173 \
            stvdy-server:ci --migrate-only

          # The three flags Chromium's sandbox needs (A338): `--shm-size` and `--tmpfs /tmp`
          # are the resources, `--security-opt seccomp=unconfined` is the permission —
          # Docker's default seccomp profile blocks the namespace the sandbox moves into, and
          # a browser that dies there leaves the boot hung with no error and no bound port.
          docker run -d --name stvdy --network host \
            --shm-size=1g --tmpfs /tmp --security-opt seccomp=unconfined \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/stvdy \
            -e APP_ENV=prod \
            -e JWT_SECRET=ci-only-secret-that-is-long-enough \
            -e ENCRYPTION_KEY_HEX=1111111111111111111111111111111111111111111111111111111111111111 \
            -e WEB_ORIGIN=http://localhost:5173 \
            -e STORAGE_BACKEND=local \
            -e STORAGE_LOCAL_DIR=/tmp/objects \
            stvdy-server:ci

          for _ in $(seq 1 60); do
            curl -fsS localhost:8080/health && break
            sleep 1
          done
          curl -fsS localhost:8080/health | grep -q '"status":"ok"'

      - name: The print assets are served from inside the image
        # The route the renderer rewrites the template's CDN references to (A339). A 404
        # here is what produces a PDF full of literal `$…$`, so it is checked before the
        # render rather than inferred from it.
        run: |
          for path in katex/katex.min.css katex/katex.min.js \
                      katex/contrib/auto-render.min.js fonts.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080/assets/$path")
            echo "$code /assets/$path"
            test "$code" = 200 || exit 1
          done

      - name: The PDF pipeline runs here, not only on a laptop
        # The same command the `pdf` job runs, against the image's own browser, pdfium and
        # assets. The binary's name carries a cargo hash, so it is resolved rather than
        # hard-coded; `scripts/release-image.sh` is the readable form of this whole
        # sequence and is what an operator runs on the production host.
        run: |
          bin=$(docker exec stvdy sh -c 'ls /opt/tests/deps/pdf-* | head -1')
          echo "running $bin"
          docker exec stvdy sh -c \
            "cd /opt/tests && CHROME_PATH=/usr/bin/chromium ./deps/$(basename "$bin") --ignored --nocapture"

      - name: Container logs on failure
        if: failure()
        run: docker logs stvdy || true

  shell:
    name: shell lint + test
    runs-on: macos-15
    # src-tauri is excluded from the workspace, so `cargo clippy --workspace`
    # never sees it. Without this job the shell's keychain code, IPC commands and
    # (from Phase 8) the whole sync engine would accumulate unlinted and
    # untested while `check` stayed green.
    #
    # macOS runner on purpose: the keychain round-trip test needs a real OS
    # credential store, and the keyring stores are cfg-gated per platform, so a
    # headless Linux runner has no store to exercise.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # REQUIRED, not optional: `generate_context!()` expands at compile time and
      # panics when `frontendDist` (../app/dist) is absent. dist/ is gitignored,
      # so without this the shell cannot compile on a fresh checkout.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - run: npm --prefix app run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      # `--workspace`, and it is load-bearing: `src-tauri/plugins/mobile` is a member of
      # this workspace (a path dependency of a workspace root is a member), so without the
      # flag clippy and test select the `stvdy-shell` package alone — and the plugin's Rust
      # half, including the background scheduler and the FCM seam, ships unlinted with a
      # test suite that reads as coverage and provides none. `fmt --all` already reached it,
      # which is how the gap went unnoticed: one of the three commands was correct.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

  web:
    name: web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      # `npm test` carries the design-system gates: token contrast (every
      # documented pair, both themes), the i18n contract, the pseudo-locale
      # expansion, and axe on the component gallery.
      - run: npm --prefix app test
      - run: npm --prefix app run build
      # Every runtime asset must be bundled: the desktop shell's CSP allows no
      # remote origin, and the phone build is used on Wi-Fi that is often down.
      # This runs against the *web* build, before the store build replaces it in
      # `app/dist` below, because the web build is the one that ships on every
      # platform. Both are CDN-clean, but only one of them can be checked here.
      - run: node scripts/check-no-cdn.mjs
      # The store build, produced the way `tauri build` produces it rather than by
      # a second convention: the CLI sets `TAURI_ENV_PLATFORM` to the target it is
      # packaging for and runs `beforeBuildCommand` with it, so this is the same
      # env var and the same `app/dist` the iOS and Android shells package. That is
      # what makes the bytes inspected below the bytes a phone installs — with
      # `build:mobile` they were a second artifact in a directory nothing packages.
      - run: TAURI_ENV_PLATFORM=ios npm --prefix app run build
      # The absence proof, in the artifact rather than in a component: the shipped
      # bytes must contain no purchase affordance, and the policy must still deny
      # purchase UI on both store platforms. It runs *after* the build because that
      # is when the files exist, and it runs in CI rather than by hand because a
      # check that is only run by hand is the one that is skipped (A321).
      #
      # **It refuses to pass on anything not stamped `store`**, and that is the
      # property worth having: the web/desktop build legitimately registers a
      # checkout route, so a green result on it would say nothing about the bundle
      # a phone installs. An absent stamp fails too — a pass on an artifact the
      # check cannot identify is not evidence about what a store receives.
      - run: node scripts/check-no-purchase-ui.mjs
      - run: node --test scripts/check-no-purchase-ui.test.mjs scripts/extract-embedded-assets.test.mjs

  desktop:
    name: desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            args: --target universal-apple-darwin --no-bundle
          - os: windows-2025
            args: --no-bundle
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - name: Build shell
        # --no-bundle so unsigned artifacts build without certificates; signing
        # and notarization arrive in Phase 15.
        run: ./app/node_modules/.bin/tauri build ${{ matrix.args }}
