[plans.pro]
name = "Pro"
price_idr_monthly = 10000
price_idr_yearly = 100000
student_percent_off = 50
# Limits are explicit: a bare integer is a real maximum (0 means zero), and
# "unlimited" means no cap. A `0 = unlimited` sentinel could not express a
# genuine zero, which mattered immediately: free allows ZERO Google accounts
# while power allows unlimited, and the sentinel read free as unlimited.
