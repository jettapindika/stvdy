# Its own workspace root, because the root workspace excludes this package (see the
# comment there): `tauri_build::build()` must not run during `cargo clippy --workspace`
# and the shell has a different target set. Being a separate root is also why it needs
# these lints spelled out again -- `[workspace.lints]` in the root does not reach it, and
# without them the project's "no unwrap in non-test code" rule is unenforced in the one
# crate that holds a keychain and a SQLite cache.
[workspace]

[package]
name = "stvdy-shell"
version = "0.1.4"
edition = "2024"
rust-version = "1.94.1"
publish = false

[lints]
workspace = true

[lib]
name = "stvdy_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-os = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The sync engine, its wire DTOs and the local-first store's two traits. The root
# `Cargo.toml` has claimed this dependency since Phase 1 while the shell did not have it;
# Phase 8's shell slice is what makes the claim true. `rusqlite` and `reqwest` stay on
# this side of the boundary (A182): the server's test binaries must never link a C SQLite.
stvdy-sync = { path = "../crates/sync" }
# `bundled` is deliberate (`docs/ARCHITECTURE.md` § Local cache): it removes a system
# SQLite from the platform matrix.
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.23.1"
# `stvdy_sync::client::Transport` is declared with `#[async_trait]`, and the shell
# implements it twice (HTTP and the double a test drives a pass with), so the attribute
# has to be the same version the trait was expanded with.
async-trait = "0.1.92"

# Secure storage: keyring-core plus a per-platform store. The `keyring` crate's
# default feature set is desktop-only (Entry::new returns NoDefaultStore on
# iOS/Android), so each target wires its own store explicitly.
keyring-core = "1.0.0"

# Desktop-only plugins must not be linked into mobile builds.
#
# tauri-plugin-updater arrived in Phase 15 with its signing keypair and release
# endpoint (A35, A335). It is here rather than in the common block because the
# plugin declares `ios: none, android: none` — mobile updates ship through
# TestFlight and Play, and a mobile build that linked it would fail to compile
# rather than silently expose an API that does nothing.
#
# The plugin's `Config.pubkey` field has no serde default, so an absent
# `plugins.updater` block is a deserialization panic at startup ("Error
# deserializing 'plugins.updater'"). That is why the config and this dependency
# land in the same commit: an updater registered without a key is not a degraded
# updater, it is an app that does not start.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
# The desktop half of A310's platform split. The official plugin raises local notifications
# and cannot receive remote push; its mobile equivalent is the community crate in the target
# block below. Only one of the two is ever linked into a given build — see that block for why
# that is a hard requirement rather than tidiness.
tauri-plugin-notification = "2.6.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2.13.3"
# The `deep-link` feature forwards a second process's CLI arguments (i.e. a
# `stvdy://` URL) to the deep-link plugin on the surviving instance. Without it,
# a Windows/Linux OAuth callback launches a second process, single-instance
# terminates it, and the URL is never delivered. So the `state`/PKCE handoff is
# lost and login silently fails whenever the app is already open. macOS routes
# `open url` to the running app and does not need this path, which makes the bug
# look platform-specific.
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }

# macOS uses the legacy keychain (works for unsigned dev builds); iOS has only
# the protected data store. The crate exposes them as separate feature-gated
# modules, so the features must differ per target.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-haptics = "2.4.2"
# The custom mobile plugin (A311): the `BGTaskScheduler`/`WorkManager` background
# seam and the Android share intake, in one crate because they share a `setup()`
# hook and a Rust entry point. Mobile-only, like the plugins above: it links the
# native halves, and a desktop build that linked them would compile Swift and Kotlin
# for platforms it cannot run on.
tauri-plugin-stvdy-mobile = { path = "plugins/mobile" }
# Push receive (A310). Mobile-only, and **the platform split is what makes two notification
# plugins legal**: this one and the official `tauri-plugin-notification` both declare the
# Android namespace `app.tauri.notification`, and AGP 9 refuses to merge a manifest two
# libraries claim — with both linked into one Android build, **no APK can be assembled at
# all**. The official one is therefore desktop-only (see the target block above) and this one
# is mobile-only, so no build ever contains both. The collision appeared when the official
# plugin sat in the *common* dependencies, which is what this arrangement corrects.
#
# The split is also what keeps macOS 11 supported: this crate's macOS half runs `swift build`,
# which requires a deployment target of 12.0 or later, and `bundle.macOS.minimumSystemVersion`
# is 11.0.
#
# `push-notifications` is **not** a default feature. Without it the plugin's registration code
# is not compiled at all and `registerForPushNotifications` returns an error, so the Android
# build would ship no FCM dependency and the iOS build no APNs registration — a receive path
# that compiles and never receives.
tauri-plugin-notifications = { version = "0.5.0-rc.14", features = ["push-notifications"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "sync"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
