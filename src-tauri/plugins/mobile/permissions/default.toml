"$schema" = "schemas/schema.json"

# The plugin's default permission set.
#
# `tauri_plugin::Builder` autogenerates one permission file per command under
# `autogenerated/`; the *default set* is deliberately not autogenerated, so it is
# written here. Without it `stvdy-mobile:default` in `capabilities/mobile.json` is an
# unknown permission and the capability fails to resolve at build time.
#
# All three commands are granted: this capability is mobile-only
# (`"platforms": ["iOS", "android"]`), and on mobile all three are the plugin's
# purpose rather than an optional extra.
[default]
description = """
The mobile plugin's commands: scheduling the background sync, running one pass, and
filing a shared file.
"""
permissions = [
  "allow-mobile-scheduler-register",
  "allow-mobile-background-sync",
  "allow-mobile-share-intake",
]
