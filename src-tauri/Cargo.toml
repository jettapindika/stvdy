[package]
name = "stvdy-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[lib]
name = "stvdy_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-notification = "2.6.0"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"
tauri-plugin-opener = "2.7.1"
tauri-plugin-os = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The sync engine, its wire DTOs and the local-first store's two traits. The root
# `Cargo.toml` has claimed this dependency since Phase 1 while the shell did not have it;
# Phase 8's shell slice is what makes the claim true. `rusqlite` and `reqwest` stay on
# this side of the boundary (A182): the server's test binaries must never link a C SQLite.
stvdy-sync = { path = "../crates/sync" }
# `bundled` is deliberate (`docs/ARCHITECTURE.md` § Local cache): it removes a system
# SQLite from the platform matrix.
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "sync"] }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.23.1"
# `stvdy_sync::client::Transport` is declared with `#[async_trait]`, and the shell
# implements it twice (HTTP and the double a test drives a pass with), so the attribute
# has to be the same version the trait was expanded with.
async-trait = "0.1.92"

# Secure storage: keyring-core plus a per-platform store. The `keyring` crate's
# default feature set is desktop-only (Entry::new returns NoDefaultStore on
# iOS/Android), so each target wires its own store explicitly.
keyring-core = "1.0.0"

# Desktop-only plugins must not be linked into mobile builds.
#
# tauri-plugin-updater is deliberately NOT here: it needs a signing keypair and a
# release endpoint (both Phase 15), and registering it with placeholder config
# panics at startup ("Error deserializing 'plugins.updater'"). An updater that
# cannot check for updates is a fake capability, so it arrives with the release
# pipeline instead.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
# The `deep-link` feature forwards a second process's CLI arguments (i.e. a
# `stvdy://` URL) to the deep-link plugin on the surviving instance. Without it,
# a Windows/Linux OAuth callback launches a second process, single-instance
# terminates it, and the URL is never delivered. So the `state`/PKCE handoff is
# lost and login silently fails whenever the app is already open. macOS routes
# `open url` to the running app and does not need this path, which makes the bug
# look platform-specific.
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }

# macOS uses the legacy keychain (works for unsigned dev builds); iOS has only
# the protected data store. The crate exposes them as separate feature-gated
# modules, so the features must differ per target.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-haptics = "2.4.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
