name: Unsigned artifacts

# The unsigned path to the three installers — a macOS `.dmg`, a Windows NSIS `.exe` and the
# direct-channel `.apk` — for building, testing and handing out a build **before the
# certificates exist**.
#
# `release.yml` is the signed path and it is untouched by this file. It refuses to run
# without `APPLE_CERTIFICATE` on purpose (A333: an unsigned, unnotarized macOS build runs
# only on the machine that built it, and publishing one as a release is worse than a failed
# release), and it warns rather than fails for Windows (A334: an unsigned installer is a
# known degraded state, not a release failure). This workflow is the deliberate override of
# that refusal, which is why it is a separate file with a separate name and why its release
# notes say what is missing on every artifact.
#
# **It never touches the updater channel.** `bundle.createUpdaterArtifacts` is overridden to
# `false` and no `latest.json` is produced or published, so a build from here cannot reach an
# installed app. The override is not cosmetic: with the flag at its committed value the CLI
# refuses to build at all without `TAURI_SIGNING_PRIVATE_KEY` ("A public key has been found,
# but no private key").
#
# The Android project (`src-tauri/gen/android`) is generated in this workflow rather than
# committed, because it is not in the tree: Phase 14's Android half was blocked without an
# Android SDK, so `tauri android init` has never run for this repository.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to build. It must equal the tree's, in all four places.
        required: true
        default: 0.1.2
      visibility:
        description: What to do with the GitHub Release once the artifacts are built.
        type: choice
        options: [prerelease, public, draft]
        default: prerelease
      apk_signing:
        description: >-
          How the APK is signed. `operator-keystore` needs the ANDROID_* secrets and produces
          the direct-channel APK; `debug` needs no key material and produces a debug-signed
          APK that installs but cannot be updated in place by a release build.
        type: choice
        options: [operator-keystore, debug]
        default: operator-keystore

concurrency:
  group: unsigned-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The one place the "no updater artifacts" override lives, so no job can forget it.
  UNSIGNED: '{"bundle":{"createUpdaterArtifacts":false}}'

jobs:
  # -------------------------------------------------------------------------
  # The version, before anything is built from it.
  # -------------------------------------------------------------------------
  version:
    name: the tree agrees with the version being built
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.agree.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: The input, Cargo.toml, tauri.conf.json and the iOS template agree
        # The same four places `chore(release)` moves by hand, asserted rather than trusted:
        # `crates/server/tests/release.rs` binds the first two and `src-tauri/tests/share_group.rs`
        # binds the fourth. A build labelled 0.1.2 whose shell reports 0.1.1 is a mislabelled
        # artifact, and this is the only step that can catch it before it is uploaded.
        id: agree
        env:
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          workspace="$(awk '/^\[workspace\.package\]/{f=1} f && /^version *=/{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)"
          shell="$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          ios="$(awk '/CFBundleShortVersionString/{print $2; exit}' src-tauri/gen/apple/project.yml.template)"

          echo "input:              $WANT"
          echo "Cargo.toml:         $workspace"
          echo "tauri.conf.json:    $shell"
          echo "project.yml:        $ios"

          for pair in "Cargo.toml:$workspace" "tauri.conf.json:$shell" "project.yml.template:$ios"; do
            file="${pair%%:*}"; got="${pair#*:}"
            if [ "$got" != "$WANT" ]; then
              echo "::error::$file says '$got' and the input says '$WANT'; bump the tree or the input"
              exit 1
            fi
          done
          echo "version=$WANT" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # macOS: universal, unsigned, unnotarized (the A333 refusal, overridden on purpose).
  # -------------------------------------------------------------------------
  macos:
    name: macOS — universal dmg, unsigned
    runs-on: macos-15
    needs: version
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          # `universal-apple-darwin` is a lipo of these two, and the CLI refuses the target
          # when either is missing.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app

      - name: What the certificate's absence costs, said before the build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::warning::APPLE_CERTIFICATE is not set: this dmg is unsigned and unnotarized, so Gatekeeper refuses it on any machine but the one that built it (A333). It is a test build, and the release notes say so."
          fi

      - name: Build the universal dmg
        run: ./app/node_modules/.bin/tauri build --target universal-apple-darwin --bundles dmg --config "$UNSIGNED"

      - name: The architectures, measured rather than assumed
        run: |
          set -euo pipefail
          app="$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)"
          archs="$(lipo -archs "$app/Contents/MacOS/Stvdy")"
          echo "archs: $archs"
          case "$archs" in *arm64*) ;; *) echo "::error::not universal: $archs"; exit 1 ;; esac
          case "$archs" in *x86_64*) ;; *) echo "::error::not universal: $archs"; exit 1 ;; esac

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # -------------------------------------------------------------------------
  # Windows: the NSIS installer, unsigned (A334's degraded state, taken knowingly).
  # -------------------------------------------------------------------------
  windows:
    name: Windows — NSIS installer, unsigned
    runs-on: windows-2025
    needs: version
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app

      - name: What the certificate's absence costs, said before the build
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if [ -z "${WINDOWS_CERTIFICATE:-}" ]; then
            echo "::warning::WINDOWS_CERTIFICATE is not set: SmartScreen warns on every install and an unsigned binary never accrues publisher reputation (A334)."
          fi

      - name: Build the NSIS installer
        # `--bundles nsis` and not the config's `["app", "dmg", "nsis"]`: the other two are
        # not valid bundle kinds on Windows.
        #
        # `shell: bash` rather than pwsh: the override is a JSON string, and PowerShell
        # re-quotes a native command's arguments in a way that strips the inner double quotes
        # (`{bundle:{createUpdaterArtifacts:false}}`, which is not JSON). An environment
        # variable expanded by bash has no such problem, and Git Bash is on the runner.
        shell: bash
        run: ./app/node_modules/.bin/tauri build --bundles nsis --config "$UNSIGNED"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

  # -------------------------------------------------------------------------
  # Android: the direct-channel APK (A352), from a project generated here.
  # -------------------------------------------------------------------------
  android:
    name: Android — the direct-channel APK
    runs-on: ubuntu-24.04
    needs: version
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 9.3.1's module metadata declares `org.gradle.jvm.version: 17`, so 17 is the
          # minimum and is what the generated project's `JvmTarget.JVM_1_8` compiles under.
          java-version: 17

      - name: The SDK packages the generated project asks for
        # `android-actions/setup-android@v3` is deliberately **not** used: its default
        # `packages` input is `tools platform-tools`, and `tools` is no longer a package
        # `sdkmanager` can resolve — the action fails with `Failed to find package 'tools'`
        # and exit 1 before any of this runs (observed on run 38237309810). The ubuntu-24.04
        # runner image already carries an SDK, so this installs only what is missing.
        #
        # **The platform id is `android-37.0`, not `android-37`.** API 37 has no plain
        # `android-37` package: Google's channel lists `platforms;android-37.0`,
        # `;android-37.1` and `;android-37.2` and nothing else for that level
        # (`repository2-3.xml`, read 2026-10-12), which is why `sdkmanager --install
        # platforms;android-37` failed with `Failed to find package 'platforms;android-37'`
        # on run 38238167815. The generated project asks for `compileSdk = 37` /
        # `targetSdk = 37`; AGP 9 resolves that against the platform the SDK actually has,
        # and the step prints both the id it installed and the directories on disk so a
        # mismatch is visible in the log rather than only in AGP's error.
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "sdkmanager: $sdkmanager"

          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms"
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools"

          # The NDK is cargo's linker, not Gradle's: the generated project has no
          # `ndkVersion` and no `externalNativeBuild`, so AGP never asks for one — but
          # cargo-mobile2 does, and it reads **`NDK_HOME` and nothing else**
          # (`cargo-mobile2` 0.22.5 `src/android/ndk.rs::Env::new` reads the variable, rejects
          # a non-directory, and parses `<it>/source.properties` for the revision; its floor
          # is 19.0). So the version is pinned by this line rather than left to a scan.
          #
          # `ANDROID_NDK_ROOT` is the runner image's own default (27.3.13750724 in the
          # ubuntu-24.04 image, which also sets `ANDROID_NDK` and `ANDROID_NDK_HOME` to it),
          # so the build uses the NDK the image vendors as default rather than the newest
          # directory present — with three installed, "highest" is 30.0.16248370 and that is
          # not a version anything here has been tested against.
          ndk="${ANDROID_NDK_ROOT:-}"
          if [ -z "$ndk" ]; then
            ndk="$(ls -d "$ANDROID_HOME"/ndk/*/ | sort -V | tail -1)"
          fi
          echo "NDK: $ndk"
          test -f "$ndk/source.properties" || { echo "::error::no NDK at $ndk"; exit 1; }
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app

      - name: Generate the Android project, if the tree does not carry one
        # `src-tauri/gen/android` is not in the tree today (Phase 14's Android half was
        # blocked without an SDK, so `tauri android init` had never run for this repository),
        # so the release cannot assume it exists. Conditional rather than unconditional
        # because `init` on an existing project rewrites it — and once Phase 14 commits the
        # project, the committed one is the one that must build.
        # `--ci` skips the CLI's prompts, which a runner cannot answer.
        run: |
          set -euo pipefail
          if [ -d src-tauri/gen/android ]; then
            echo "the tree carries src-tauri/gen/android: using it as it is"
          else
            ./app/node_modules/.bin/tauri android init --ci --skip-targets-install
          fi

      - name: The direct-APK keystore, from secrets, for this run only
        if: inputs.apk_signing == 'operator-keystore'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Either set the four ANDROID_* secrets (A352: the direct APK is signed by the operator's key, not Play's) or re-run with apk_signing=debug."
            exit 1
          fi
          keystore="$RUNNER_TEMP/direct-apk.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          # `printf` and not a heredoc, for the same reason as the step below: a plain
          # heredoc's terminator has to sit at column 0, which a YAML block scalar forbids.
          printf '%s\n' \
            "storeFile=$keystore" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" > src-tauri/gen/android/keystore.properties
          chmod 600 "$keystore" src-tauri/gen/android/keystore.properties

      - name: Wire the keystore into the generated Gradle build
        if: inputs.apk_signing == 'operator-keystore'
        # `keystore.properties` alone signs nothing. The project `tauri android init` writes
        # has **no** `signingConfigs` block and its release build type sets no `signingConfig`
        # (read out of `@tauri-apps/cli` 2.12.2's own `app/build.gradle.kts` template: the
        # file's only reference to the properties file is a `.gitignore` entry), so a release
        # APK comes out unsigned and Gradle refuses the build. Tauri's own Android signing
        # guide is explicit that the Gradle block is the operator's to add.
        #
        # The block is **appended as a second `android { }`**, not spliced into the middle of
        # the file: Gradle's Kotlin DSL runs these blocks in order, so a block at the end
        # creates `signingConfigs.release` after `buildTypes.release` exists and can assign
        # to it — whereas inserting `signingConfigs` above `buildTypes` would depend on the
        # template's exact layout, which is another project's file and moves with its version.
        # Idempotent, so a committed project that already carries the block is left alone.
        #
        # Appended with `printf`, not a heredoc: a heredoc's body and terminator have to start
        # at column 0 for the shell, and a YAML block scalar cannot contain a line that is not
        # indented past its key — the two requirements are incompatible, and the first attempt
        # at this step produced a workflow file GitHub could not parse.
        run: |
          set -euo pipefail
          gradle=src-tauri/gen/android/app/build.gradle.kts
          if grep -q "signingConfigs" "$gradle"; then
            echo "the project already declares signingConfigs: leaving it alone"
            exit 0
          fi
          printf '%s\n' \
            '' \
            '// Added by .github/workflows/unsigned-artifacts.yml. `keystore.properties` is' \
            '// written from Actions secrets for one run and is never committed; `rootProject`' \
            '// here is `src-tauri/gen/android`, which is where that file is written.' \
            'android {' \
            '    signingConfigs {' \
            '        create("release") {' \
            '            val keystoreProperties = rootProject.file("keystore.properties")' \
            '            if (keystoreProperties.exists()) {' \
            '                val properties = java.util.Properties().apply {' \
            '                    keystoreProperties.inputStream().use { load(it) }' \
            '                }' \
            '                keyAlias = properties.getProperty("keyAlias")' \
            '                keyPassword = properties.getProperty("keyPassword")' \
            '                storeFile = file(properties.getProperty("storeFile"))' \
            '                storePassword = properties.getProperty("storePassword")' \
            '            }' \
            '        }' \
            '    }' \
            '    buildTypes {' \
            '        getByName("release") {' \
            '            signingConfig = signingConfigs.getByName("release")' \
            '        }' \
            '    }' \
            '}' >> "$gradle"
          echo "appended the signingConfigs block:"
          tail -22 "$gradle"

      - name: The store build carries no purchase UI
        # A compile-time config, so the same absence has to hold for the direct channel.
        run: |
          TAURI_ENV_PLATFORM=android npm --prefix app run build
          node scripts/check-no-purchase-ui.mjs

      - name: Build the APK
        # `--debug` for the keyless path: a debug-signed APK installs (that is the whole point
        # of it) and a release APK with no signing config does not.
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ inputs.apk_signing }}" = "debug" ]; then extra="--debug"; fi
          ./app/node_modules/.bin/tauri android build --apk --ci $extra --config "$UNSIGNED"

      - name: The APK carries no purchase UI either
        run: |
          set -euo pipefail
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -1)"
          if [ -z "$apk" ]; then
            echo "::error::no APK under src-tauri/gen/android/app/build/outputs/apk"
            exit 1
          fi
          echo "checking $apk"
          # Against the artifact rather than the build directory: "the build output was clean"
          # and "the artifact is clean" are different claims (A351, A352).
          bash scripts/check-mobile-no-purchase.sh "$apk"
          suffix=""
          if [ "${{ inputs.apk_signing }}" = "debug" ]; then suffix="-debug"; fi
          mkdir -p dist/release
          cp "$apk" "dist/release/Stvdy_${{ needs.version.outputs.version }}_universal${suffix}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: dist/release/*.apk

  # -------------------------------------------------------------------------
  # The Release.
  # -------------------------------------------------------------------------
  publish:
    name: the GitHub Release
    runs-on: ubuntu-24.04
    needs: [version, macos, windows, android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: What is about to be published
        run: ls -lR dist/release

      - name: Checksums, so a download can be shown to be the upload
        run: |
          set -euo pipefail
          cd dist/release
          # Written outside the directory first: the shell truncates the redirect target
          # before `sha256sum` runs, so `./*` would otherwise include a hash of the empty
          # file it is about to write.
          sha256sum ./* > "$RUNNER_TEMP/sums"
          mv "$RUNNER_TEMP/sums" SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          VISIBILITY: ${{ inputs.visibility }}
          APK_SIGNING: ${{ inputs.apk_signing }}
        run: |
          set -euo pipefail
          tag="v$VERSION"

          if [ "$APK_SIGNING" = "debug" ]; then
            apk_note="signed with the **debug** key: it installs, and a later release build signed with the operator's key **cannot** update it in place (uninstall first)."
          else
            apk_note="signed with the operator's direct-channel key (A352), not Play's."
          fi

          # The filenames are read from what the jobs actually uploaded rather than written
          # out from a pattern. The bundler names its own files (`{productName}_{version}_{arch}`,
          # with `universal` for the lipo target), and a note that guesses the name of a file
          # the reader then cannot find is worse than no table. One of each extension, because
          # the workflow produces one of each; more than one is a failure rather than a choice.
          # `|| true` inside each substitution: with `set -o pipefail` a glob that matches
          # nothing makes `ls` exit non-zero, and `set -e` would then abort the step at the
          # assignment — silently, because the error was already sent to /dev/null. The loop
          # below is what reports the missing file, and it has to be reached to do that.
          dmg="$(ls dist/release/*.dmg 2>/dev/null | head -1 || true)"
          exe="$(ls dist/release/*-setup.exe 2>/dev/null | head -1 || true)"
          apk="$(ls dist/release/*.apk 2>/dev/null | head -1 || true)"
          for pair in "dmg:$dmg" "exe:$exe" "apk:$apk"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::no ${pair%%:*} among the uploaded artifacts, so the notes cannot name it"
              ls -l dist/release
              exit 1
            fi
          done
          dmg="$(basename "$dmg")"; exe="$(basename "$exe")"; apk="$(basename "$apk")"
          echo "dmg=$dmg exe=$exe apk=$apk"

          # `printf` and not a heredoc: a plain heredoc's body and terminator have to start at
          # column 0, which a YAML block scalar forbids — and the indented body a YAML-safe
          # heredoc does produce would arrive in the notes as a markdown code block. No
          # backticks in the text either, so no line has to fight the shell's quoting.
          printf '%s\n' \
            "Stvdy $VERSION — **unsigned test build**. Not a release for students." \
            '' \
            'The three installers are attached, and each one is missing the signature that makes' \
            'it distributable:' \
            '' \
            '| File | What is missing |' \
            '|---|---|' \
            "| $dmg | macOS, universal (arm64 + x86_64), **unsigned and unnotarized**: Gatekeeper refuses it on any machine but the one that built it. Right-click → Open, or run: xattr -dr com.apple.quarantine /Applications/Stvdy.app |" \
            "| $exe | Windows x64, NSIS, **unsigned**: SmartScreen warns on every install. |" \
            "| $apk | Android, $apk_note |" \
            '' \
            '**The updater channel is untouched.** createUpdaterArtifacts is false for this build,' \
            'and no latest.json was written or published, so no installed app will be offered it.' \
            'The signed path — the one that does publish a manifest — is' \
            '.github/workflows/release.yml, and it needs the certificates in docs/RELEASE.md.' \
            '' \
            'The client talks to https://api.stvdy.app; the server is not part of this release.' \
            'SHA256SUMS.txt covers every file above.' > notes.md
          cat notes.md

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "the release exists: uploading into it"
            gh release upload "$tag" dist/release/* --clobber
          else
            # `--target "$GITHUB_SHA"` and not the default: without it `gh release create`
            # tags the repository's default-branch HEAD *at creation time*, which is not
            # necessarily the commit these artifacts were built from — a tag that names one
            # commit while its files came from another is the one thing a release must not do.
            case "$VISIBILITY" in
              public)     gh release create "$tag" --title "v$VERSION" --target "$GITHUB_SHA" --notes-file notes.md dist/release/* ;;
              prerelease) gh release create "$tag" --title "v$VERSION" --target "$GITHUB_SHA" --prerelease --notes-file notes.md dist/release/* ;;
              draft)      gh release create "$tag" --title "v$VERSION" --target "$GITHUB_SHA" --draft --notes-file notes.md dist/release/* ;;
              *) echo "::error::unknown visibility '$VISIBILITY'"; exit 1 ;;
            esac
          fi

      - name: "The round trip: what the Release serves"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --json tagName,isDraft,isPrerelease,assets \
            --jq '"\(.tagName) draft=\(.isDraft) prerelease=\(.isPrerelease)", (.assets[] | "  \(.name)\t\(.size) bytes")'
