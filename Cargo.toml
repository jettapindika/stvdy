[workspace]
resolver = "3"
members = ["crates/core", "crates/sync", "crates/server"]
# src-tauri is its own workspace: it has a different toolchain target set and
# `tauri_build::build()` must not run during `cargo clippy --workspace`
# (it panics when the bundle icon files are absent, and the lint CI job has
# neither Node nor a built dist/). It path-depends on crates/sync and keeps its
# own committed Cargo.lock.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "proprietary"
publish = false

[workspace.dependencies]
# --- internal ---
stvdy-core = { path = "crates/core" }
stvdy-sync = { path = "crates/sync" }

# --- serialization / config ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.1.8"

# --- errors / logging ---
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# --- time / identity ---
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }

# --- misc ---
hex = "0.4.3"
base64 = "0.23.1"
rand = "0.10.3"
secrecy = "0.10.3"
async-trait = "0.1.92"
futures = "0.3.34"
bytes = "1.12.1"
tokio-util = "0.7.20"
unicode-segmentation = "1.13.3"

# --- async / web ---
tokio = { version = "1.53.2", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "signal",
  "sync",
  "fs",
] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tower = { version = "0.5.3", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7.1", features = [
  "cors",
  "trace",
  "limit",
  "timeout",
  "request-id",
  "catch-panic",
  "sensitive-headers",
] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }

# --- database ---
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "macros",
  "migrate",
  "uuid",
  "chrono",
  "json",
] }
pgvector = { version = "0.4.2", features = ["sqlx"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
