[workspace]
resolver = "3"
members = ["crates/core", "crates/sync", "crates/server"]
# src-tauri is its own workspace: it has a different toolchain target set and
# `tauri_build::build()` must not run during `cargo clippy --workspace`
# (it panics when the bundle icon files are absent, and the lint CI job has
# neither Node nor a built dist/). It path-depends on crates/sync and keeps its
# own committed Cargo.lock.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.94.1"
license = "proprietary"
publish = false

[workspace.dependencies]
# --- internal ---
stvdy-core = { path = "crates/core" }
stvdy-sync = { path = "crates/sync" }

# --- serialization / config ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.1.8"
dotenvy = "0.15.7"

# --- document rendering (Phase 6) ---
# Pinned: the PDF pipeline's output is part of what a student prints, so a minor
# upgrade must be a deliberate change with the acceptance test re-run, not something a
# `cargo update` pulls in. Chromium itself is pinned separately, in the image.
headless_chrome = "1.0.22"
# The acceptance test reads the rendered PDF's text back. A hand-rolled extractor was
# returning nothing, which would have made the `no raw $` assertion pass vacuously: the
# one assertion the test exists for. A real extractor is the only honest option.
pdf-extract = "0.12.1"
# The print assets (`assets/`) are embedded at compile time and served from
# `GET /assets/{*path}` (A339). Embedded rather than read from disk so a missing file is
# a build failure instead of a 404 at print time — the asset that would be missing is a
# KaTeX stylesheet, and the failure it causes is a PDF full of literal `$…$`.
# No `mime-guess`: the route maps the three extensions it serves to their content types
# explicitly, so the dependency would only be a second source of truth.
rust-embed = "8.13.0"

# --- errors / logging ---
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# --- time / identity ---
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }

# --- calendar (Phase 10) ---
# Pinned for the same reason `headless_chrome` is: the feed is a document a client
# caches and the parser is what reads someone else's, so a minor upgrade must be a
# deliberate change with the acceptance test re-run.
#
# `features = ["parser"]` is REQUIRED and is NOT a default feature: without it
# `icalendar::parser::read_components` does not exist, so both the feed's round-trip
# test and the whole ICS import fail to compile. The builder half (generation) needs
# no feature.
icalendar = { version = "0.17.14", features = ["parser"] }
# The recurrence engine, pinned explicitly rather than used through `icalendar`'s
# re-export: the crate re-exports only a *subset* of `rrule`'s types, so relying on it
# would tie the expansion API to `icalendar`'s release cadence and could silently hand
# back a different `rrule` version than the one this plan's bound is written against.
# `all(limit) -> RRuleResult { dates, limited }` is the pair A232 depends on.
rrule = "0.14"

# --- misc ---
hex = "0.4.3"
base64 = "0.23.1"
rand = "0.10.3"
secrecy = "0.10.3"
# Lock poisoning has no remedy for the two in-process caches this workspace keeps — the
# Google client's access token and the test doubles' scripts — so the lock that cannot
# produce a poisoning error is the one used.
parking_lot = "0.12.5"
async-trait = "0.1.92"
# The chat SSE stream is written as an `async_stream::stream!` block: the
# alternative is a hand-written `Stream` impl whose poll function has to keep the
# provider receiver, the accumulated answer and the heartbeat timer in one state
# machine. That is a lot of unsafe-adjacent code for a stream that is a `loop`
# with `yield`s.
async-stream = "0.3.6"
futures = "0.3.34"
bytes = "1.12.1"
tokio-util = "0.7.20"
unicode-segmentation = "1.13.3"

# --- auth / crypto (Phase 1) ---
# `rust_crypto` picks the pure-Rust backend: the default `aws-lc-rs` needs a C
# toolchain and a cmake that the Windows CI job does not have.
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
argon2 = "0.6.0"
sha2 = "0.11.0"
hmac = "0.13.0"
# Protects the Google login `state` parameter, which carries the PKCE verifier
# (A48), and is what `ENCRYPTION_KEY_HEX` exists for.
aes-gcm = "0.11.0"

# --- email (Phase 1, A4) ---
# rustls with webpki roots, not native-tls: the same reasoning as sqlx's
# `tls-rustls-ring`, and it keeps the Docker image from needing OpenSSL.
# `tokio1-rustls-tls` (not `tokio1-rustls`) is the one that also selects a
# crypto provider and a certificate store; without them the build fails with
# "feature `rustls` also requires ...". `pool` keeps a verification mail from
# paying a full SMTP handshake each time.
lettre = { version = "0.11.23", default-features = false, features = [
  "builder",
  "smtp-transport",
  "pool",
  "hostname",
  "tokio1-rustls-tls",
] }

# --- object storage (Phase 1, A15) ---
aws-config = "1.12.0"
aws-sdk-s3 = "1.152.0"

# --- embeddings and documents (Phase 1, A2) ---
# `ort-download-binaries-rustls-tls` fetches the ONNX runtime at build time so
# no system onnxruntime is required; the model itself is fetched at first use.
fastembed = { version = "7.1.1", default-features = false, features = [
  "hf-hub-rustls-tls",
  "ort-download-binaries-rustls-tls",
] }
# The model's own tokenizer, for the chunker's token budget (A2). The same
# version fastembed already depends on, so it is not a second copy.
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
# Dynamic binding only: pdfium is loaded from PDFIUM_LIB_PATH at runtime, so the
# build needs no pdfium binary and the Docker image supplies one (roadmap
# Phase 6/1 risk note). Default features pull the `image` crate for rendering,
# which this app never does.
pdfium-render = { version = "0.9.4", default-features = false, features = [
  "pdfium_latest",
  "thread_safe",
] }

# --- http client / OAuth (Phase 1, A48) ---
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "form",
  # The search tiers build query strings, and `query` is what URL-encodes them.
  "query",
  "rustls",
  "stream",
  "multipart",
  # APNs' provider API is HTTP/2-only (A288). `default-features = false` turns the
  # feature off, and without it the request is HTTP/1.1, which APNs answers with
  # nothing useful — a `BadRequest` with no explanation of what was wrong.
  "http2",
] }
url = "2.5.8"

# --- async / web ---
tokio = { version = "1.53.2", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "signal",
  "sync",
  "fs",
] }

# `multipart` is for POST /workspaces/:id/sources, which takes the file and the
# pasted-text form of a source through one endpoint.
axum = { version = "0.8.9", features = ["macros", "multipart"] }

# The `PaymentProvider` contract takes a `HeaderMap` (roadmap § 1), so `crates/core`
# needs the type. This is the types crate only — no server, no IO, no async runtime —
# and it is already in the tree under `axum` 0.8, so taking it in core is cheaper than
# inventing a second header representation and converting at every boundary.
http = "1.5.0"
tower = { version = "0.5.3", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7.1", features = [
  "cors",
  "trace",
  "limit",
  "timeout",
  "request-id",
  "catch-panic",
  "sensitive-headers",
] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }

# --- database ---
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "macros",
  "migrate",
  "uuid",
  "chrono",
  "json",
] }
pgvector = { version = "0.4.2", features = ["sqlx"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
