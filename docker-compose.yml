services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stvdy
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stvdy"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Dev object storage. A15: MinIO removed its community container images —
  # `minio/minio:latest` and `minio/mc:latest` both 404 on Docker Hub — so this
  # uses `pgsty/silo`, a maintained drop-in fork of the MinIO server (same S3
  # API, same MINIO_* variables, same `server /data` argv). The bucket is
  # created by the server at boot (plan decision 4), so there is no
  # `minio-init` sidecar.
  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    # The binary's own probe, which is what upstream declares in both of its
    # Dockerfiles (`HEALTHCHECK ... CMD ["/usr/bin/silo", "healthcheck", "ready"]`).
    # The old `mc ready local` belonged to the `minio/mc` image that 404s (A15),
    # and a `curl` probe would work on the goreleaser tag but not on the
    # distroless one, which ships neither shell nor curl.
    healthcheck:
      test: ["CMD", "/usr/bin/silo", "healthcheck", "ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Search tier 2 (A3): the self-hosted general-web provider behind
  # SearchProvider. Internal only. Nothing outside the server calls it, and it
  # is not exposed on a public interface.
  #
  # The settings file is rendered into a volume rather than mounted from the repo
  # because SearXNG honours no `SEARXNG_SECRET` variable and does no `${VAR}`
  # expansion in YAML: mounting the repo file would skip the entrypoint's
  # "generate a random secret" branch and run with whatever is committed. See
  # searxng/settings.yml.
  searxng-init:
    image: busybox:latest
    environment:
      # Deliberately NOT `${SEARXNG_SECRET:?}`: compose interpolates every
      # service before selecting one, so a required-variable error here would
      # break `docker compose up postgres` for anyone who has not set a search
      # secret. The emptiness check lives in the command instead, so the failure
      # is scoped to starting searxng.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./searxng/settings.yml:/template/settings.yml:ro
      - searxng-config:/etc/searxng
    command: >
      sh -c '
      if [ -z "$$SEARXNG_SECRET" ]; then
        echo "SEARXNG_SECRET is empty. Set it in .env (openssl rand -hex 32) before starting searxng." >&2;
        exit 1;
      fi;
      sed "s|__SEARXNG_SECRET__|$$SEARXNG_SECRET|" /template/settings.yml > /etc/searxng/settings.yml;
      echo "searxng settings rendered"'

  searxng:
    image: searxng/searxng:latest
    depends_on:
      searxng-init:
        condition: service_completed_successfully
    volumes:
      # The rendered config. The entrypoint chowns it to searxng:searxng when
      # running as root (FORCE_OWNERSHIP defaults to true), so the init
      # container does not need to.
      - searxng-config:/etc/searxng
    ports: ["8088:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
  searxng-config:
