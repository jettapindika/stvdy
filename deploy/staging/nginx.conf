# The SPA and the API on **one origin**, for the staging stack
# (`deploy/staging/docker-compose.staging.yml`).
#
# Cloudflare terminates TLS for the hostname and proxies to this server on port 80, so the
# browser only ever sees `https://<host>/…`. That is why the API is mounted under `/api`
# rather than published on its own port: `VITE_API_BASE_URL` is baked into the bundle at build
# time, so the bundle and the proxy have to agree on one origin, and a second public port
# would be a second cleartext surface for the same credentials.
#
# **This is the deviation from `docs/OPERATIONS.md` § The reverse proxy**, which describes the
# production shape (TLS terminated at the proxy, the API on its own origin). Here the proxy is
# nginx, the TLS is Cloudflare's, and the two rules that still apply are the ones below:
# `proxy_buffering off` for SSE, and the upload limit.

# Cloudflare sends `X-Forwarded-Proto: https`; a direct request has none. `$scheme` is the
# fallback so a request that bypasses Cloudflare (an operator on the host) is still honest.
map $http_x_forwarded_proto $upstream_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A source upload is capped by the server at the largest plan's `max_file_mb` plus multipart
  # framing (`crates/server/src/sources/routes.rs::max_upload_bytes` — 100 MiB on Power, so
  # ~101 MiB). nginx's own default is 1 MiB, which would refuse a Pro upload with a 413 before
  # the server's own, better error could answer.
  client_max_body_size 110m;

  # --- the API ---
  #
  # The trailing slash on `proxy_pass` is what strips the prefix: `/api/auth/login` reaches the
  # server as `/auth/login`, so the server keeps its own routes at the root and nothing in the
  # Rust tree has to know it is mounted under a path.
  #
  # `OBJECTS_PUBLIC_BASE_URL` must name the same prefix (`https://<host>/api`), because the
  # presigned read URL is built as `{base}/objects/{id}` and has to come back through here.
  location /api/ {
    proxy_pass http://server:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_proto;

    # SSE: `GET /workspaces/:id/chat` and `GET /sync/stream`. A proxy that buffers holds the
    # response until it is complete, which for a stream is never — the client sees nothing and
    # the connection eventually dies. `docs/OPERATIONS.md` § The reverse proxy makes this a
    # defect rather than a tuning choice, and the heartbeat exists precisely because proxies
    # close idle streams.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    chunked_transfer_encoding off;
  }

  # --- the SPA ---
  #
  # Client-side routes: /signin, /workspaces/… and the rest are not files.
  location / {
    try_files $uri /index.html;
  }

  # Vite emits content-hashed filenames, so the bundle is safe to cache hard. The document is
  # not. The server's own print assets are *not* here — they are at `/api/assets/…` for anything
  # outside the container, and headless Chromium inside it reaches them directly through
  # `ASSETS_BASE_URL` (127.0.0.1:8080), which is what a PDF needs (A339).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
