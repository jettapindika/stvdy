<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to be non-zero.
         Do not add user-scalable=no (accessibility; iOS ignores it anyway). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Stvdy</title>

    <!-- Fonts are self-hosted: see src/fonts.css and public/fonts. The desktop
         build therefore renders type offline, and the shell's CSP needs no remote
         font origins. A preconnect hint would also be governed by connect-src. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
