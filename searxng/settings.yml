# SearXNG configuration for the search tier (A3).
#
# This file is a TEMPLATE. It is never mounted into the container directly: the
# `searxng-init` compose service renders `__SEARXNG_SECRET__` from the
# environment into a named volume, and the `searxng` service mounts that volume.
#
# Why the indirection: SearXNG honours no `SEARXNG_SECRET` variable (verified in
# `container/entrypoint.sh`. It only `sed`s the literal `ultrasecretkey` in the
# settings file it *creates*, and `searx/settings_loader.py` does a plain
# `yaml.safe_load` with no `${VAR}` expansion). Because we supply a settings
# file, the entrypoint's "create from template" branch is skipped entirely, so a
# committed `secret_key` would be the value that actually runs. A45 deploys this
# stack to a public-IP VPS, where a known `secret_key` lets anyone forge SearXNG
# session and CSRF cookies.
#
# Only what we must override is here; SearXNG merges this over its own defaults,
# so an incomplete file is expected.
#
# The two settings that matter for programmatic use:
#   formats: [html, json]. The JSON output is what SearchProvider consumes.
#     It is NOT enabled by default, and without it the API returns HTML.
#   limiter: false. The bot-detection limiter would reject our
#     server-side requests, since they are not a browser session.
#
# Internal only: reached over the compose network, and nothing outside the
# server should call it.

use_default_settings: true

general:
  instance_name: "stvdy-search"
  enable_metrics: false

server:
  # Rendered from SEARXNG_SECRET by searxng-init. Never commit a real value.
  secret_key: "__SEARXNG_SECRET__"
  limiter: false
  image_proxy: false
  bind_address: "0.0.0.0:8080"

search:
  # `json` is required for the API; `html` is kept for manual debugging.
  formats:
    - html
    - json
  # Keep result pages small: we only need the top hits, and the server truncates
  # and caches them anyway (A40).
  max_page: 1
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"

ui:
  static_use_hash: true

# Engines are left at SearXNG's defaults; the composite provider picks the
# academic APIs directly (OpenAlex, Crossref, arXiv, ...) and uses SearXNG as
# the general-web tier.
