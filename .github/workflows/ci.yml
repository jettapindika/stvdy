name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    env:
      # No database in this job: compile against the committed .sqlx cache.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    services:
      postgres:
        # pgvector, not plain postgres: migration 0001 runs
        # `create extension vector`, which plain postgres cannot satisfy.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stvdy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stvdy
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        # `--locked` no longer works: sqlx 0.9 does not track its Cargo.lock.
        # The TLS feature is `rustls`, not `rustls-ring`.
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls
      - run: sqlx migrate run
      - run: cargo sqlx prepare --workspace --check
      - run: cargo test --workspace

  pdf:
    name: pdf acceptance (Chromium)
    # ubuntu-24.04's runner image ships Google Chrome stable at
    # /usr/bin/google-chrome, which is what CHROME_PATH names. The phase's
    # acceptance test is `#[ignore]`d so a laptop without a browser still gets a
    # green `cargo test --workspace`; this is the job where it must actually run,
    # because a test nobody runs is the same as not having one.
    #
    # No database: the acceptance test renders the template with sample blocks and
    # prints it, so it needs a browser and nothing else. SQLX_OFFLINE keeps it from
    # waiting on a Postgres that is not there.
    runs-on: ubuntu-24.04
    env:
      SQLX_OFFLINE: "true"
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Fail early if Chrome is not where the phase says it is
        # Without this the test panics with "no Chromium found; set CHROME_PATH",
        # which reads like a code problem rather than a runner-image change.
        run: test -x "$CHROME_PATH" || { echo "no Chrome at $CHROME_PATH"; exit 1; }
      - run: cargo test -p stvdy-server --test pdf -- --ignored

  shell:
    name: shell lint + test
    runs-on: macos-15
    # src-tauri is excluded from the workspace, so `cargo clippy --workspace`
    # never sees it. Without this job the shell's keychain code, IPC commands and
    # (from Phase 8) the whole sync engine would accumulate unlinted and
    # untested while `check` stayed green.
    #
    # macOS runner on purpose: the keychain round-trip test needs a real OS
    # credential store, and the keyring stores are cfg-gated per platform, so a
    # headless Linux runner has no store to exercise.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # REQUIRED, not optional: `generate_context!()` expands at compile time and
      # panics when `frontendDist` (../app/dist) is absent. dist/ is gitignored,
      # so without this the shell cannot compile on a fresh checkout.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - run: npm --prefix app run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  web:
    name: web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      # `npm test` carries the design-system gates: token contrast (every
      # documented pair, both themes), the i18n contract, the pseudo-locale
      # expansion, and axe on the component gallery.
      - run: npm --prefix app test
      - run: npm --prefix app run build
      # Every runtime asset must be bundled: the desktop shell's CSP allows no
      # remote origin, and the phone build is used on Wi-Fi that is often down.
      - run: node scripts/check-no-cdn.mjs

  desktop:
    name: desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            args: --target universal-apple-darwin --no-bundle
          - os: windows-2025
            args: --no-bundle
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - name: Build shell
        # --no-bundle so unsigned artifacts build without certificates; signing
        # and notarization arrive in Phase 15.
        run: ./app/node_modules/.bin/tauri build ${{ matrix.args }}
