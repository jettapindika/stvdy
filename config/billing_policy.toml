# Controls where purchase UI may appear. iOS and Android must never sell:
# QRIS checkout is web/desktop only, and the plan then syncs to the account on
# every device. `validate()` rejects a mobile entry that enables purchase UI,
# shows prices, or allows a CTA. So this file cannot be edited into an
# app-store policy violation.

[platforms.web]
allow_purchase_ui = true
show_prices = true
allow_purchase_cta_in_locked_messages = true

[platforms.macos]
allow_purchase_ui = true
show_prices = true
allow_purchase_cta_in_locked_messages = true

[platforms.windows]
allow_purchase_ui = true
show_prices = true
allow_purchase_cta_in_locked_messages = true

[platforms.ios]
allow_purchase_ui = false
show_prices = false
allow_purchase_cta_in_locked_messages = false

[platforms.android]
allow_purchase_ui = false
show_prices = false
allow_purchase_cta_in_locked_messages = false
